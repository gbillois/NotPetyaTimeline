.ws-root,
.ws-root * { box-sizing: border-box; }
.ws-root {
  font-family: var(--ws-font-body);
  color: var(--ws-color-text);

}

.ws-display {
  font-family: var(--ws-font-display);
  font-weight: var(--ws-weight-extrabold);
  font-size: var(--ws-text-6xl);
  line-height: var(--ws-leading-none);

  color: var(--ws-color-heading);
}
.ws-h1 { font-family: var(--ws-font-display); font-weight: var(--ws-weight-bold); font-size: var(--ws-text-4xl); line-height: var(--ws-leading-tight); letter-spacing: var(--ws-tracking-tight); color: var(--ws-color-heading); margin: 0; }
.ws-h2 { font-family: var(--ws-font-display); font-weight: var(--ws-weight-bold); font-size: var(--ws-text-3xl); line-height: var(--ws-leading-tight); color: var(--ws-color-heading); margin: 0; }
.ws-h3 { font-family: var(--ws-font-display); font-weight: var(--ws-weight-semibold); font-size: var(--ws-text-xl); line-height: var(--ws-leading-snug); color: var(--ws-color-heading); margin: 0; }
.ws-body { font-family: var(--ws-font-body); font-size: var(--ws-text-base); line-height: var(--ws-leading-relaxed); color: var(--ws-color-text); }
.ws-small { font-size: var(--ws-text-sm); color: var(--ws-color-text-muted); }

.ws-eyebrow {
  display: inline-block;
  font-family: var(--ws-font-body);
  font-weight: var(--ws-weight-bold);
  font-size: var(--ws-text-xs);
  letter-spacing: var(--ws-tracking-eyebrow);
  text-transform: uppercase;
  color: var(--ws-color-text);
  padding-bottom: var(--ws-space-1);
  border-bottom: var(--ws-border-width-thick) solid var(--ws-color-accent);
}

.ws-stat {
  font-family: var(--ws-font-display);
  font-weight: var(--ws-weight-bold);
  font-size: var(--ws-text-7xl);
  line-height: var(--ws-leading-none);
  letter-spacing: var(--ws-tracking-tight);
  color: var(--ws-color-accent);
}
.ws-stat__label {
  display: block;
  font-family: var(--ws-font-body);
  font-weight: var(--ws-weight-semibold);
  font-size: var(--ws-text-base);
  color: var(--ws-color-text);
  margin-top: var(--ws-space-2);
}

.ws-text-accent  { color: var(--ws-color-accent-strong); }
.ws-text-primary { color: var(--ws-color-primary); }
.ws-text-muted   { color: var(--ws-color-text-muted); }

.ws-btn {
  --_pad-y: var(--ws-space-3);
  --_pad-x: var(--ws-space-6);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ws-space-2);
  font-family: var(--ws-font-body);
  font-weight: var(--ws-weight-semibold);
  font-size: var(--ws-text-sm);
  line-height: 1;
  padding: var(--_pad-y) var(--_pad-x);
  border: var(--ws-border-width) solid transparent;
  border-radius: var(--ws-radius-pill);
  cursor: pointer;
  text-decoration: none;
  transition: background var(--ws-duration-base) var(--ws-ease-standard),
              color var(--ws-duration-base) var(--ws-ease-standard),
              border-color var(--ws-duration-base) var(--ws-ease-standard),
              box-shadow var(--ws-duration-base) var(--ws-ease-standard),
              transform var(--ws-duration-fast) var(--ws-ease-standard);
}
.ws-btn:active { transform: translateY(1px); }
.ws-btn:focus-visible { outline: none; box-shadow: var(--ws-shadow-focus); }
.ws-btn:disabled,
.ws-btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
.ws-btn--primary { background: var(--ws-color-primary); color: var(--ws-color-primary-contrast); }
.ws-btn--primary:hover { background: var(--ws-color-primary-hover); box-shadow: var(--ws-shadow-brand); }
.ws-btn--accent { background: var(--ws-color-accent); color: var(--ws-color-accent-contrast); }
.ws-btn--accent:hover { background: var(--ws-green-300); }
.ws-btn--outline { background: transparent; color: var(--ws-color-primary); border-color: var(--ws-color-primary); }
.ws-btn--outline:hover { background: var(--ws-color-primary-subtle); }
.ws-btn--ghost { background: transparent; color: var(--ws-color-text); }
.ws-btn--ghost:hover { background: var(--ws-color-bg-muted); }
.ws-btn--sm { --_pad-y: var(--ws-space-2); --_pad-x: var(--ws-space-4); font-size: var(--ws-text-xs); }
.ws-btn--lg { --_pad-y: var(--ws-space-4); --_pad-x: var(--ws-space-8); font-size: var(--ws-text-base); }

.ws-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--ws-space-1);
  font-family: var(--ws-font-body);
  font-weight: var(--ws-weight-bold);
  font-size: var(--ws-text-xs);
  letter-spacing: var(--ws-tracking-wide);
  text-transform: uppercase;
  padding: var(--ws-space-1) var(--ws-space-3);
  border-radius: var(--ws-radius-sm);
  line-height: 1.4;
}
.ws-badge--primary { background: var(--ws-color-primary); color: var(--ws-white); }
.ws-badge--accent  { background: var(--ws-color-accent); color: var(--ws-indigo-900); }
.ws-badge--teal    { background: var(--ws-color-secondary); color: var(--ws-white); }
.ws-badge--subtle  { background: var(--ws-color-primary-subtle); color: var(--ws-color-primary); }
.ws-badge--outline { background: transparent; border: var(--ws-border-width) solid var(--ws-color-border-strong); color: var(--ws-color-text-muted); }

.ws-card {
  background: var(--ws-color-surface);
  border: var(--ws-border-width) solid var(--ws-color-border);
  border-radius: var(--ws-radius-xl);
  padding: var(--ws-space-6);
  box-shadow: var(--ws-shadow-sm);
  transition: box-shadow var(--ws-duration-base) var(--ws-ease-standard),

}
.ws-card--interactive:hover { box-shadow: var(--ws-shadow-lg); transform: translateY(-2px); }
.ws-card__title { font-family: var(--ws-font-display); font-weight: var(--ws-weight-semibold); font-size: var(--ws-text-xl); color: var(--ws-color-heading); margin: 0 0 var(--ws-space-2); }
.ws-card__body  { color: var(--ws-color-text-muted); margin: 0; }

.ws-quote {
  font-family: var(--ws-font-display);
  font-weight: var(--ws-weight-bold);
  font-size: var(--ws-text-2xl);
  line-height: var(--ws-leading-snug);
  color: var(--ws-color-primary);
  text-align: center;
  max-width: 38ch;
  margin: 0 auto;
}
.ws-quote__cite {
  display: block;
  font-family: var(--ws-font-body);
  font-weight: var(--ws-weight-medium);
  font-size: var(--ws-text-sm);
  color: var(--ws-color-text-muted);
  margin-top: var(--ws-space-4);
}

.ws-input,
.ws-select,
.ws-textarea {
  width: 100%;
  font-family: var(--ws-font-body);
  font-size: var(--ws-text-base);
  color: var(--ws-color-text);
  background: var(--ws-color-surface);
  border: var(--ws-border-width) solid var(--ws-color-border-strong);
  border-radius: var(--ws-radius-md);
  padding: var(--ws-space-3) var(--ws-space-4);
  transition: border-color var(--ws-duration-base) var(--ws-ease-standard),

}
.ws-input::placeholder,
.ws-textarea::placeholder { color: var(--ws-color-text-subtle); }
.ws-input:focus,
.ws-select:focus,
.ws-textarea:focus {
  outline: none;
  border-color: var(--ws-color-focus-ring);
  box-shadow: var(--ws-shadow-focus);
}
.ws-label {
  display: inline-block;
  font-weight: var(--ws-weight-semibold);
  font-size: var(--ws-text-sm);
  color: var(--ws-color-text);
  margin-bottom: var(--ws-space-2);
}

.ws-divider { height: var(--ws-border-width); background: var(--ws-color-divider); border: 0; margin: var(--ws-space-6) 0; }
.ws-rule-accent { height: var(--ws-border-width-thick); width: 56px; background: var(--ws-color-accent); border: 0; border-radius: var(--ws-radius-pill); }

.ws-link {
  color: var(--ws-color-primary);
  text-decoration: none;
  font-weight: var(--ws-weight-medium);

.ws-link:hover { border-bottom-color: var(--ws-color-accent); }

.ws-container { max-width: var(--ws-container-xl); margin-inline: auto; padding-inline: var(--ws-space-6); }
.ws-stack > * + * { margin-top: var(--ws-space-4); }
.ws-cluster { display: flex; flex-wrap: wrap; gap: var(--ws-space-3); align-items: center; }

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; padding: 0; }
body {
  background: var(--ws-white);

// OAHF — 7-step briefing
//
// A 30-minute awareness session for senior management, weighted toward what is
// genuinely new about agents rather than toward security spend. The full

const mulberry32 = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let x = Math.imul(a ^ (a >>> 15), 1 | a);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
  return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
};
const pick = (total, n, seed) => {
  const rnd = mulberry32(seed);
  const idx = [...Array(total).keys()];
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return new Set(idx.slice(0, n));
};

    const onKey = (e) => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.code === 'ArrowRight' || e.code === 'Space' || e.code === 'PageDown') { e.preventDefault(); go(i + 1); }
      else if (e.code === 'ArrowLeft' || e.code === 'PageUp') { e.preventDefault(); go(i - 1); }
      else if (e.code === 'Home') go(0);
      else if (e.code === 'End') go(last);
      else if (e.key >= '1' && e.key <= '7') go(Number(e.key));
      else if (e.key === 'f' || e.key === 'F') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [i, go, last]);

  const s = i > 0 ? STEPS[i - 1] : null;
  const dark = i === 0 || (s && s.dark);
  const chrome = dark ? 'rgba(255,255,255,.62)' : W.ink400;
  const chromeStrong = dark ? W.white : W.ink900;

  return (
    <div style={{ height: '100vh', width: '100vw', position: 'relative', overflow: 'hidden' }}>
      <div key={i} style={{ height: '100%' }}>
        {i === 0 ? <Cover onStart={() => go(1)} /> : <Step s={s} />}
      </div>

      {/* progress + navigation */}
      {i > 0 && (
        <div style={{
          position: 'absolute', top: 0, left: 0, right: 0,
          display: 'flex', alignItems: 'center', gap: 16,
          padding: 'clamp(16px, 2.2vw, 30px) clamp(28px, 5vw, 88px)', pointerEvents: 'none',
        }}>
          <button onClick={() => go(0)} style={{
            pointerEvents: 'auto', fontSize: 11.5, fontWeight: 700, letterSpacing: '.14em',
            color: chrome, textTransform: 'uppercase',
          }}>OpenAI ⇄ Hugging Face</button>

          <div style={{ display: 'flex', gap: 6, marginLeft: 'auto', pointerEvents: 'auto' }}>
            {STEPS.map(st => (
              <button key={st.n} onClick={() => go(st.n)} title={st.title}
                style={{
                  width: st.n === i ? 26 : 9, height: 9, borderRadius: 99,
                  background: st.n === i ? (dark ? W.green400 : W.indigo600)
                            : st.n < i ? (dark ? 'rgba(255,255,255,.55)' : W.ink300)
                            : (dark ? 'rgba(255,255,255,.22)' : W.ink100),
                  transition: 'width .25s, background .25s',
                }} />
            ))}
          </div>
          <span className="b-mono" style={{ fontSize: 11.5, color: chrome, minWidth: 82, textAlign: 'right' }}>
            {s.mins} min
          </span>
        </div>
      )}

      {i > 0 && (
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0,
          display: 'flex', alignItems: 'center', gap: 14,
          padding: 'clamp(14px, 2vw, 26px) clamp(28px, 5vw, 88px)', pointerEvents: 'none',
        }}>
          <span className="b-figure" style={{ fontSize: 15, color: chrome, letterSpacing: 0 }}>
            {String(i).padStart(2, '0')}<span style={{ opacity: .5 }}> / {String(last).padStart(2, '0')}</span>
          </span>
          <a href="OAHF-zoom.html" style={{
            pointerEvents: 'auto', marginLeft: 'auto', fontSize: 11.5, color: chrome, textDecoration: 'none',
          }}>▶ Animated zoom-out</a>
          <a href={FULL_RECORD} target="_blank" rel="noreferrer" style={{
            pointerEvents: 'auto', fontSize: 11.5, color: chrome, textDecoration: 'none',
          }}>Full 62-event reconstruction ↗</a>
          <button onClick={() => go(i - 1)} disabled={i === 1} style={{
            pointerEvents: 'auto', color: chromeStrong, opacity: i === 1 ? .3 : 1,
            border: `1px solid ${dark ? 'rgba(255,255,255,.3)' : W.ink200}`,
            borderRadius: 8, padding: '8px 14px', fontSize: 12, fontWeight: 600,
          }}>←</button>
          <button onClick={() => go(i + 1)} disabled={i === last} style={{
            pointerEvents: 'auto', opacity: i === last ? .3 : 1,
            background: dark ? W.green400 : W.indigo600, color: dark ? W.indigo900 : W.white,
            borderRadius: 8, padding: '8px 18px', fontSize: 12, fontWeight: 700, letterSpacing: '.08em',
          }}>NEXT →</button>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
