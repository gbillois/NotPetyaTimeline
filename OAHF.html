const { useState, useEffect, useRef, useMemo, useCallback } = React;

const lerpAt = (t, pts) => {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) {
      const [t0, v0] = pts[i - 1], [t1, v1] = pts[i];
      const k = t1 === t0 ? 1 : (t - t0) / (t1 - t0);
      return v0 + (v1 - v0) * k;
    }
  }
  return pts[pts.length - 1][1];
};

// PANEL 2 — THE SWARM
// 1,200 dots, one per agent. They were built to never meet. Watch them find
// each other (amber), then watch ~700 of them join the attack (red).
// ═══════════════════════════════════════════════════════════════════════════

const mulberry32 = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let x = Math.imul(a ^ (a >>> 15), 1 | a);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
  return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
};

const TOTAL_AGENTS = 1200, SW_COLS = 48, SW_ROWS = 25;

// Deterministic join orders, computed once. Attackers are drawn from the
// agents that reached the board earliest, so the red set is always a subset
// of the amber one no matter where the playhead sits.
const SWARM_ORDER = (() => {
  const rnd = mulberry32(20260712);
  const shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  const joinOrder = shuffle([...Array(TOTAL_AGENTS).keys()]);   // index -> nth to join
  const boardRank = new Int16Array(TOTAL_AGENTS);
  joinOrder.forEach((idx, rank) => { boardRank[idx] = rank; });
  const attackPool = shuffle(joinOrder.slice(0, 900));
  const attackRank = new Int16Array(TOTAL_AGENTS).fill(9999);
  attackPool.forEach((idx, rank) => { attackRank[idx] = rank; });
  return { boardRank, attackRank };
})();

const AgentSwarm = ({ t, width, height }) => {
  const ref = useRef(null);
  const board = lerpAt(t, CURVE_BOARD);
  const attack = lerpAt(t, CURVE_ATTACK);

  useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    cv.width = width * dpr; cv.height = height * dpr;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    const padX = 2, padY = 2;
    const pitchX = (width - padX * 2) / SW_COLS;
    const pitchY = (height - padY * 2) / SW_ROWS;
    const r = Math.max(1.1, Math.min(pitchX, pitchY) * 0.30);
    const { boardRank, attackRank } = SWARM_ORDER;

    for (let i = 0; i < TOTAL_AGENTS; i++) {
      const col = i % SW_COLS, row = (i / SW_COLS) | 0;
      const cx = padX + pitchX * (col + 0.5), cy = padY + pitchY * (row + 0.5);
      const isAttacking = attackRank[i] < attack;
      const isOnBoard = boardRank[i] < board;
      if (isAttacking) {
        ctx.fillStyle = 'rgba(255,68,56,0.13)';
        ctx.beginPath(); ctx.arc(cx, cy, r * 1.9, 0, Math.PI * 2); ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(cx, cy, isAttacking ? r * 1.3 : isOnBoard ? r * 0.85 : r * 0.7, 0, Math.PI * 2);
      ctx.fillStyle = isAttacking ? '#ff4438' : isOnBoard ? 'rgba(217,164,65,0.72)' : 'rgba(150,175,200,0.16)';
      ctx.fill();
    }
  }, [t, width, height, board, attack]);

  return <canvas ref={ref} style={{ width, height, display: 'block' }} />;
};

const PanelHead = ({ title, note }) => (

const SwarmPanel = ({ t }) => {
  const wrapRef = useRef(null);
  const [dims, setDims] = useState({ w: 380, h: 190 });
  useEffect(() => {
    const measure = () => {
      if (!wrapRef.current) return;
      const r = wrapRef.current.getBoundingClientRect();
      setDims({ w: Math.max(180, r.width), h: Math.max(90, r.height) });
    };
    measure();
    const ro = new ResizeObserver(measure);
    if (wrapRef.current) ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);

  const board = lerpAt(t, CURVE_BOARD), attack = lerpAt(t, CURVE_ATTACK);
  const legend = [
    { c: 'rgba(150,175,200,0.35)', label: 'isolated as designed', v: fmt(Math.max(0, TOTAL_AGENTS - board)) },
    { c: '#d9a441', label: 'on the board', v: fmt(board) },
    { c: '#ff4438', label: 'in the attack', v: fmt(attack) },
  ];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: 0, height: '100%' }}>
      <PanelHead title="THE SWARM · 1,200 AGENTS"
        note="One dot per agent. Every one of them was engineered never to meet another." />
      <div ref={wrapRef} style={{ flex: 1, minHeight: 0, padding: '12px 16px 6px' }}>
        <AgentSwarm t={t} width={dims.w - 32} height={Math.max(70, dims.h - 18)} />
      </div>
      <div style={{ display: 'flex', gap: 16, padding: '4px 18px 14px', flexWrap: 'wrap' }}>
        {legend.map((l, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
            <span style={{ width: 7, height: 7, borderRadius: '50%', background: l.c, flexShrink: 0 }} />
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, fontWeight: 700, color: l.c === 'rgba(150,175,200,0.35)' ? 'rgba(185,198,212,0.6)' : l.c }}>{l.v}</span>
            <span style={{ fontSize: 10, color: 'rgba(185,198,212,0.45)' }}>{l.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════════════════

const App = () => {
  const events = window.OAHF_EVENTS;

  const [currentTime, setTimeRaw] = useState(() => {
    try { const v = parseFloat(localStorage.getItem('oahf:t') || '0'); return isFinite(v) ? Math.max(0, Math.min(1, v)) : 0; } catch { return 0; }
  });
  const [activeId, setActiveIdRaw] = useState(() => { try { return localStorage.getItem('oahf:active') || 'e01'; } catch { return 'e01'; } });
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(1);
  const [showBrief, setShowBrief] = useState(() => { try { return localStorage.getItem('oahf:seen') !== '1'; } catch { return true; } });

  const setCurrentTime = useCallback((t) => { setTimeRaw(t); try { localStorage.setItem('oahf:t', String(t)); } catch {} }, []);
  const setActiveId = useCallback((id) => { setActiveIdRaw(id); try { localStorage.setItem('oahf:active', id); } catch {} }, []);

  // the playhead selects the most recent event that has fired
  useEffect(() => {
    const fired = events.filter(e => e.t <= currentTime + 0.0008);
    if (fired.length) {
      const latest = fired[fired.length - 1];
      if (latest.id !== activeId) setActiveId(latest.id);
    }
  }, [currentTime]);

  useEffect(() => {
    if (!playing) return;
    let raf, last = null;
    const DURATION = 105; // seconds for the full 4-month sweep
    const step = (ts) => {
      if (last == null) last = ts;
      const dt = (ts - last) / 1000; last = ts;
      setTimeRaw(prev => {
        const next = prev + (dt / DURATION) * speed;
        if (next >= 1) { setPlaying(false); try { localStorage.setItem('oahf:t', '1'); } catch {} return 1; }
        try { localStorage.setItem('oahf:t', String(next)); } catch {}
        return next;
      });
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [playing, speed]);

  const jump = useCallback((ev) => { setActiveId(ev.id); setCurrentTime(ev.t); setPlaying(false); }, []);

  const dismissBrief = () => { setShowBrief(false); try { localStorage.setItem('oahf:seen', '1'); } catch {} };

  useEffect(() => {
    const onKey = (e) => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (showBrief) { if (e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); dismissBrief(); } return; }
      const i = events.findIndex(x => x.id === activeId);
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      else if (e.code === 'ArrowLeft')  { e.preventDefault(); const n = events[Math.max(0, i - 1)]; if (n) jump(n); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); const n = events[Math.min(events.length - 1, i + 1)]; if (n) jump(n); }
      else if (e.key === '0' || e.code === 'Home') { setCurrentTime(0); setActiveId('e01'); setPlaying(false); }
      else if (e.key === '?') setShowBrief(true);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [activeId, events, showBrief]);

  const [vw, setVw] = useState(() => (typeof window !== 'undefined' ? window.innerWidth : 1600));
  useEffect(() => {
    const onR = () => setVw(window.innerWidth);
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);
  const narrow = vw < 1180;
  const leftW = vw < 1500 ? 236 : 288;
  const rightW = vw < 1500 ? 372 : 440;

  const active = events.find(e => e.id === activeId) || events[0];
  const phase = PHASES.find(p => currentTime >= p.start && currentTime < p.end) || PHASES[PHASES.length - 1];

  const rightColumn = (
    <>
      <div style={{ flex: '1 1 58%', minHeight: 0, display: 'flex', flexDirection: 'column', borderBottom: '1px solid rgba(150,175,200,0.12)' }}>
        <PanelHead title="BOUNDARY CHAIN"
          note="This attack had no geography. It had trust boundaries — and it crossed every one of them." />
        <div style={{ flex: 1, minHeight: 0, padding: '14px 14px 10px' }}>
          <BoundaryChain t={currentTime} activeZone={active && active.zone} />
        </div>
      </div>
      <div style={{ flex: '1 1 42%', minHeight: 0 }}>
        <SwarmPanel t={currentTime} />
      </div>
    </>
  );

  const shell = {
    height: '100vh', width: '100vw', background: '#06080b', color: '#b9c6d4',
    fontFamily: "'Inter', sans-serif", display: 'flex', flexDirection: 'column', overflow: 'hidden',
  };

  return (
    <div style={shell}>
      {showBrief && <Brief onClose={dismissBrief} />}

      <Header t={currentTime} phase={phase} playing={playing} setPlaying={setPlaying}
        speed={speed} setSpeed={setSpeed}
        onReset={() => { setCurrentTime(0); setActiveId('e01'); setPlaying(false); }} />

      <div style={{ borderBottom: '1px solid rgba(150,175,200,0.12)', paddingTop: 10 }}>
        <TimelineTrack events={events} currentTime={currentTime} setCurrentTime={setCurrentTime}
          activeId={activeId} setActiveId={setActiveId} setPlaying={setPlaying} narrow={narrow} />
        <div style={{
          padding: '0 26px 9px', fontSize: 9.5, color: 'rgba(185,198,212,0.34)',
          display: 'flex', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap',
        }}>
          <span style={{ fontStyle: 'italic' }}>{phase.gloss}</span>
          <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>
            time is compressed — the 4.5-day campaign occupies 40% of the rail
          </span>
        </div>
      </div>

      {narrow ? (
        <div className="oahf-scroll" style={{ flex: 1, overflowY: 'auto' }}>
          <div style={{ maxWidth: 820 }}><EventDetail event={active} /></div>
          <div style={{ display: 'flex', flexDirection: 'column', height: 620, borderTop: '1px solid rgba(150,175,200,0.12)' }}>{rightColumn}</div>
          <div style={{ borderTop: '1px solid rgba(150,175,200,0.12)' }}>
            <EventList events={events} activeId={activeId} currentTime={currentTime} onPick={jump} narrow />
          </div>
        </div>
      ) : (
        <div style={{ flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: `${leftW}px 1fr ${rightW}px` }}>
          <div style={{ borderRight: '1px solid rgba(150,175,200,0.12)', minHeight: 0 }}>
            <EventList events={events} activeId={activeId} currentTime={currentTime} onPick={jump} />
          </div>
          <div style={{ minHeight: 0, minWidth: 0 }}>
            <EventDetail event={active} />
          </div>
          <div style={{ borderLeft: '1px solid rgba(150,175,200,0.12)', minHeight: 0, display: 'flex', flexDirection: 'column' }}>
            {rightColumn}
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
