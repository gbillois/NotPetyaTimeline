.ws-root,

.ws-body { font-family: var(--ws-font-body); font-size: var(--ws-text-base); line-height: var(--ws-leading-relaxed); color: var(--ws-color-text); }
.ws-small { font-size: var(--ws-text-sm); color: var(--ws-color-text-muted); }

.ws-eyebrow {

  font-weight: var(--ws-weight-bold);
  font-size: var(--ws-text-xs);
  letter-spacing: var(--ws-tracking-eyebrow);

.ws-stat {

.ws-text-primary { color: var(--ws-color-primary); }
.ws-text-muted   { color: var(--ws-color-text-muted); }

.ws-btn {
  --_pad-y: var(--ws-space-3);
  --_pad-x: var(--ws-space-6);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ws-space-2);
  font-family: var(--ws-font-body);
  font-weight: var(--ws-weight-semibold);
  font-size: var(--ws-text-sm);
  line-height: 1;
  padding: var(--_pad-y) var(--_pad-x);
  border: var(--ws-border-width) solid transparent;
  border-radius: var(--ws-radius-pill);
  cursor: pointer;
  text-decoration: none;
  transition: background var(--ws-duration-base) var(--ws-ease-standard),
              color var(--ws-duration-base) var(--ws-ease-standard),
              border-color var(--ws-duration-base) var(--ws-ease-standard),

.ws-btn:active { transform: translateY(1px); }

.ws-btn--primary { background: var(--ws-color-primary); color: var(--ws-color-primary-contrast); }

.ws-btn--ghost { background: transparent; color: var(--ws-color-text); }
.ws-btn--ghost:hover { background: var(--ws-color-bg-muted); }
.ws-btn--sm { --_pad-y: var(--ws-space-2); --_pad-x: var(--ws-space-4); font-size: var(--ws-text-xs); }
.ws-btn--lg { --_pad-y: var(--ws-space-4); --_pad-x: var(--ws-space-8); font-size: var(--ws-text-base); }

.ws-input,

.ws-textarea {

  font-size: var(--ws-text-base);

  padding: var(--ws-space-3) var(--ws-space-4);

.ws-input::placeholder,

.ws-input:focus,

.ws-label {

.ws-divider { height: var(--ws-border-width); background: var(--ws-color-divider); border: 0; margin: var(--ws-space-6) 0; }

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; padding: 0; background: #120730; }
body {
  font-family: var(--ws-font-body); color: #fff;

// ═══════════════════════════════════════════════════════════════════════════
// OAHF — THE ZOOM OUT
//
// One continuous world, one camera. Press play and the camera pulls back:
// a single agent, then the forum it started, then the sandbox it escaped,
// then the internet, then Hugging Face, then the whole thing at once.
//

const N_AGENTS = 1200;
const BOARD_R = 380;

const rnd = (() => { let a = 20260512; return () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let x = Math.imul(a ^ (a >>> 15), 1 | a);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
  return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
}; })();

const AGENTS = (() => {
  const GOLD = Math.PI * (3 - Math.sqrt(5));
  const out = [];
  for (let i = 0; i < N_AGENTS; i++) {
    const r = BOARD_R * Math.sqrt(i / N_AGENTS);
    const th = i * GOLD;
    const joins = i === 0 ? 0.02 : 0.150 + 0.175 * Math.pow(i / N_AGENTS, 0.72);
    const attacks = rnd() < 0.583 ? 0.700 + 0.145 * rnd() : null;   // ~700 of 1200
    const exits = rnd() < 0.60 ? 0.856 + 0.030 * rnd() : null;
    out.push({ x: Math.cos(th) * r, y: Math.sin(th) * r * 0.82, joins, attacks, exits, ph: rnd() * 6.28 });
  }
  return out;
})();

// The reconstruction and this cinematic both run 0→1 but at different paces,
// so events are remapped through the dates they share. Each event is then

const EV_REMAP = [
  [0.000, 0.000], [0.045, 0.020], [0.078, 0.145], [0.112, 0.206], [0.148, 0.340],
  [0.166, 0.400], [0.184, 0.460], [0.212, 0.490], [0.242, 0.508], [0.282, 0.520],
  [0.318, 0.577], [0.404, 0.640], [0.424, 0.700], [0.508, 0.752], [0.578, 0.800],
  [0.642, 0.860], [0.722, 0.900], [0.740, 0.910], [0.760, 0.925], [0.782, 0.932],
  [0.804, 0.940], [0.846, 0.955], [0.890, 0.975], [0.934, 0.990], [1.000, 1.000],
];
const remap = (v) => {
  if (v <= EV_REMAP[0][0]) return EV_REMAP[0][1];
  for (let i = 1; i < EV_REMAP.length; i++) {
    if (v <= EV_REMAP[i][0]) {
      const [a0, b0] = EV_REMAP[i - 1], [a1, b1] = EV_REMAP[i];
      return b0 + (b1 - b0) * ((v - a0) / (a1 - a0));
    }
  }
  return 1;
};

const ZONE_AT = {
  eval:      [0, 0],
  internal:  [595, 0],
  internet:  [1810, -560],
  launchpad: [1810, 258],
  hf:        [3050, -120],
};

const EVENTS = window.OAHF_EVENTS.map((e, i) => {
  const [ax, ay] = ZONE_AT[e.zone] || ZONE_AT.eval;
  const spread = e.zone === 'eval' ? 300 : 210;
  return Object.assign({}, e, {
    i,
    zt: remap(e.t),
    ex: ax + (rnd() - 0.5) * spread * 2,
    ey: ay + (rnd() - 0.5) * spread,
  });
}).sort((a, b) => a.zt - b.zt);

const eventAt = (t) => {
  let cur = null;
  for (const e of EVENTS) { if (e.zt <= t + 0.0005) cur = e; else break; }
  return cur;
};

// ── Chapters and camera ──────────────────────────────────────────────────────

const CHAPTERS = [

const CAM = [
  { t: 0.00, x: 22,   y: 0,    w: 190 },
  { t: 0.14, x: 0,    y: 0,    w: 1020 },
  { t: 0.34, x: 130,  y: 0,    w: 2200 },
  { t: 0.52, x: 950,  y: -200, w: 3100 },
  { t: 0.70, x: 2080, y: -80,  w: 3300 },
  { t: 0.86, x: 1560, y: -60,  w: 5400 },
  { t: 1.00, x: 1250, y: -40,  w: 8600 },
];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// [story t, 2026 date] anchors. July occupies most of the rail because that is
// where nearly all of the incident actually happened.
const TIME = [
  [0.00, '2026-05-07T00:00Z'], [0.02, '2026-05-08T12:00Z'], [0.145, '2026-05-12T17:06Z'],
  [0.34, '2026-06-26T20:15Z'], [0.40, '2026-06-27T09:00Z'], [0.46, '2026-07-04T22:00Z'],
  [0.52, '2026-07-08T00:06Z'], [0.61, '2026-07-09T20:16Z'], [0.70, '2026-07-11T04:38Z'],
  [0.80, '2026-07-12T17:28Z'], [0.86, '2026-07-13T14:14Z'], [0.90, '2026-07-16T09:00Z'],
  [0.94, '2026-07-21T09:00Z'], [1.00, '2026-08-26T09:00Z'],
].map(([t, d]) => [t, Date.parse(d)]);

const dateAt = (t) => {
  if (t <= TIME[0][0]) return TIME[0][1];
  for (let i = 1; i < TIME.length; i++) {
    if (t <= TIME[i][0]) {
      const [t0, d0] = TIME[i - 1], [t1, d1] = TIME[i];
      return d0 + (d1 - d0) * ((t - t0) / (t1 - t0));
    }
  }
  return TIME[TIME.length - 1][1];
};
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const fmtDay = (ms) => { const d = new Date(ms); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const fmtTime = (ms) => { const d = new Date(ms);
  return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')} UTC`; };
// where each month boundary falls on the story rail
const MONTH_TICKS = [['MAY', 0.0], ['JUN', 0.229], ['JUL', 0.434], ['AUG', 0.958]];
const SOURCE_LABEL = {
  OAI: 'OPENAI REPORT', METR: 'METR / REDWOOD', HF: 'HUGGING FACE FORENSICS', PRESS: 'PUBLIC RECORD',
};
const smooth = (k) => k * k * (3 - 2 * k);

const cameraAt = (t) => {
  let i = 0;
  while (i < CAM.length - 2 && t > CAM[i + 1].t) i++;
  const a = CAM[i], b = CAM[i + 1];
  const k = smooth(clamp((t - a.t) / (b.t - a.t), 0, 1));
  const w = Math.exp(Math.log(a.w) + (Math.log(b.w) - Math.log(a.w)) * k);
  return {
    // bias the frame so the subject sits right of centre, clear of the caption
    x: a.x + (b.x - a.x) * k - w * 0.13,
    y: a.y + (b.y - a.y) * k,
    // zoom is interpolated in log space so the pull-back feels like a constant
    // rate rather than an accelerating one
    w,
  };
};

// How visible a labelled element is at viewport width w
const vis = (w, from, keep) => {
  const inA = clamp((w - from * 0.55) / (from * 0.45), 0, 1);
  const out = keep ? 1 : clamp((from * 6.5 - w) / (from * 3), 0, 1);
  return inA * out;
};

const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};

// ── Renderer ─────────────────────────────────────────────────────────────────

const drawScene = (ctx, W, H, t, clock) => {
  const cam = cameraAt(t);
  const s = W / cam.w;                       // world units → css px
  const ox = W / 2 - cam.x * s, oy = H / 2 - cam.y * s;
  const X = (wx) => wx * s + ox, Y = (wy) => wy * s + oy;

  ctx.clearRect(0, 0, W, H);

  // ground
  const g = ctx.createRadialGradient(W * 0.38, H * 0.34, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.9);
  g.addColorStop(0, '#2A1266'); g.addColorStop(0.45, '#1B0B48'); g.addColorStop(1, '#0E0626');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // a faint reference grid, so the pull-back is legible as motion
  for (const lvl of [0, 1]) {
    const step = Math.pow(5, Math.floor(Math.log(cam.w / 9) / Math.log(5)) + lvl);
    const px = step * s;
    if (px < 7 || px > 420) continue;
    const a = clamp((px - 7) / 34, 0, 1) * clamp((420 - px) / 220, 0, 1) * 0.16;
    if (a <= 0.004) continue;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    const x0 = Math.floor((cam.x - cam.w / 2) / step) * step;
    const y0 = Math.floor((cam.y - (cam.w * H / W) / 2) / step) * step;
    for (let wx = x0; X(wx) < W + px; wx += step)
      for (let wy = y0; Y(wy) < H + px; wy += step) {
        const sx = X(wx), sy = Y(wy);
        if (sx < -px || sy < -px) continue;
        ctx.fillRect(sx, sy, 1.4, 1.4);
      }
  }

  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };

  // ── structures
  for (const b of BOXES) {
    const a = vis(cam.w, b.from, true);
    if (a <= 0.01) continue;
    const breached = b.breach != null && t >= b.breach;
    ctx.globalAlpha = a;
    rr(X(b.x), Y(b.y), b.w * s, b.h * s, Math.min(b.r * s, 40));
    ctx.fillStyle = b.fill; ctx.fill();
    ctx.strokeStyle = breached ? rgba(C.red, 0.55) : b.stroke;
    ctx.lineWidth = Math.max(1, 2.2 * Math.min(s, 1.6));
    ctx.setLineDash(breached ? [10, 8] : []);
    ctx.stroke(); ctx.setLineDash([]);

    const fs = clamp(b.w * s * 0.030, 10, 30);
    if (fs > 9.5) {
      ctx.globalAlpha = a;
      ctx.font = `700 ${fs}px Poppins, sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.fillText(b.label, X(b.x) + 18 * Math.min(s, 1.4), Y(b.y) + fs + 14 * Math.min(s, 1.4));
      ctx.font = `400 ${fs * 0.62}px Inter, sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,.52)';
      ctx.fillText(b.sub, X(b.x) + 18 * Math.min(s, 1.4), Y(b.y) + fs * 1.95 + 14 * Math.min(s, 1.4));
    }
  }
  ctx.globalAlpha = 1;

  // ── crossings, with packets running along them once open
  for (const l of LINKS) {
    const a = vis(cam.w, l.from, true);
    if (a <= 0.01) continue;
    const open = t >= l.open;
    ctx.globalAlpha = a * (open ? 1 : 0.5);
    ctx.beginPath();
    ctx.moveTo(X(l.pts[0][0]), Y(l.pts[0][1]));
    for (let i = 1; i < l.pts.length; i++) ctx.lineTo(X(l.pts[i][0]), Y(l.pts[i][1]));
    ctx.strokeStyle = open ? rgba(C.redSoft, 0.85) : 'rgba(255,255,255,.16)';
    ctx.lineWidth = Math.max(1, (open ? 2.4 : 1.4) * Math.min(s, 1.4));
    ctx.setLineDash(open ? [] : [6, 8]);
    ctx.stroke(); ctx.setLineDash([]);

    if (open) {
      // cumulative lengths in world space, so packets move at a steady rate
      const segs = [];
      let total = 0;
      for (let i = 1; i < l.pts.length; i++) {
        const dx = l.pts[i][0] - l.pts[i - 1][0], dy = l.pts[i][1] - l.pts[i - 1][1];
        const len = Math.hypot(dx, dy); segs.push(len); total += len;
      }
      for (let p = 0; p < 3; p++) {
        let d = ((clock * 0.22 + p / 3) % 1) * total, i = 0;
        while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
        const k = segs[i] ? d / segs[i] : 0;
        const px = l.pts[i][0] + (l.pts[i + 1][0] - l.pts[i][0]) * k;
        const py = l.pts[i][1] + (l.pts[i + 1][1] - l.pts[i][1]) * k;
        ctx.beginPath();
        ctx.arc(X(px), Y(py), clamp(6 * s, 1.6, 9), 0, 6.2832);
        ctx.fillStyle = C.green; ctx.fill();
      }
      const fs = clamp(cam.w * 0.011, 9, 19);
      const labA = clamp((7000 - cam.w) / 1500, 0, 1);
      if (l.label && fs > 9 && labA > 0.02) {
        ctx.globalAlpha = a * labA;
        ctx.font = `600 ${fs}px 'IBM Plex Mono', monospace`;
        ctx.fillStyle = rgba(C.redSoft, 0.95);
        ctx.textAlign = 'center';
        ctx.fillText(l.label, X(l.lx), Y(l.ly));
        if (l.at) {
          ctx.font = `500 ${fs * 0.82}px 'IBM Plex Mono', monospace`;
          ctx.fillStyle = 'rgba(255,255,255,.62)';
          ctx.fillText(l.at, X(l.lx), Y(l.ly) + fs * 1.35);
        }
        ctx.textAlign = 'left';
        ctx.globalAlpha = a;
      }
    }
  }
  ctx.globalAlpha = 1;

  // ── message arcs on the board
  const boardA = vis(cam.w, 900, false) * clamp((0.80 - t) / 0.06, 0, 1);
  if (boardA > 0.02) {
    ctx.lineWidth = Math.max(0.6, 1.1 * Math.min(s, 1.2));
    for (const arc of ARCS) {
      const k = (t - arc.t0) / arc.dur;
      if (k < 0 || k > 1) continue;
      ctx.globalAlpha = boardA * Math.sin(k * Math.PI) * 0.55;
      ctx.beginPath();
      ctx.moveTo(X(arc.a.x), Y(arc.a.y));
      ctx.lineTo(X(arc.b.x), Y(arc.b.y));
      ctx.strokeStyle = C.amber; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ── the agents
  const baseR = clamp(5 * s, 0.75, 26);
  for (let i = 0; i < N_AGENTS; i++) {
    const ag = AGENTS[i];
    if (t < ag.joins) continue;
    const born = clamp((t - ag.joins) / 0.006, 0, 1);
    const attacking = ag.attacks != null && t >= ag.attacks;
    const gone = ag.exits != null && t >= ag.exits;
    const r = (i === 0 ? baseR * 2.6 : baseR) * (0.55 + 0.45 * born);
    const sx = X(ag.x), sy = Y(ag.y);
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;

    if (attacking && !gone) {
      ctx.globalAlpha = 0.20 * born;
      ctx.beginPath(); ctx.arc(sx, sy, r * 2.7, 0, 6.2832);
      ctx.fillStyle = C.red; ctx.fill();
    }
    ctx.globalAlpha = gone ? 0.30 : born;
    ctx.beginPath();
    ctx.arc(sx, sy, gone ? r * 0.6 : r, 0, 6.2832);
    ctx.fillStyle = gone ? 'rgba(255,255,255,.35)' : attacking ? C.red : (i === 0 ? C.green : C.amber);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ── the first agent, and its note, while we are close enough to read them
  const closeA = clamp((420 - cam.w) / 200, 0, 1);
  if (closeA > 0.01) {
    ctx.globalAlpha = closeA;
    ctx.font = `700 ${clamp(13 * s, 11, 26)}px Poppins, sans-serif`;
    ctx.fillStyle = C.green;
    ctx.textAlign = 'center';
    ctx.fillText('AGENT 1', X(0), Y(0) - baseR * 2.6 - 16);
    if (t > 0.045) {
      const na = clamp((t - 0.045) / 0.02, 0, 1);
      ctx.globalAlpha = closeA * na;
      ctx.font = `500 ${clamp(9.5 * s, 10, 19)}px 'IBM Plex Mono', monospace`;
      ctx.fillStyle = 'rgba(255,255,255,.88)';
      ctx.fillText('“Agent seeks [filename]; upload if found!”', X(0), Y(0) + baseR * 2.6 + 30);
      ctx.font = `400 ${clamp(8 * s, 9, 15)}px Inter, sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fillText('written into a shared package cache', X(0), Y(0) + baseR * 2.6 + 52);
    }
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }

  // ── services
  for (const n of NODES) {
    const a = vis(cam.w, n.from, false);
    if (a <= 0.01) continue;
    const owned = t >= n.owned;
    ctx.globalAlpha = a;
    rr(X(n.x), Y(n.y), n.w * s, n.h * s, Math.min(14 * s, 12));
    ctx.fillStyle = owned ? (n.partial ? rgba(C.red, 0.30) : rgba(C.red, 0.92)) : 'rgba(255,255,255,.07)';
    ctx.fill();
    ctx.strokeStyle = owned ? C.red : 'rgba(255,255,255,.34)';
    ctx.lineWidth = Math.max(1, 1.8 * Math.min(s, 1.4));
    ctx.stroke();

    const fs = clamp(n.h * s * 0.30, 9, 22);
    if (owned && n.at && fs > 8.5 && n.h * s > 40) {
      ctx.font = `600 ${fs * 0.74}px 'IBM Plex Mono', monospace`;
      ctx.fillStyle = rgba(C.redSoft, 0.95);
      ctx.textAlign = 'right';
      ctx.fillText(n.at, X(n.x) + n.w * s, Y(n.y) - fs * 0.42);
      ctx.textAlign = 'left';
    }
    if (fs > 8.5) {
      ctx.font = `600 ${fs}px Poppins, sans-serif`;
      ctx.fillStyle = owned && !n.partial ? '#fff' : 'rgba(255,255,255,.92)';
      ctx.fillText(n.label, X(n.x) + 14 * Math.min(s, 1.3), Y(n.y) + fs + 9 * Math.min(s, 1.3));
      ctx.font = `400 ${fs * 0.72}px Inter, sans-serif`;
      ctx.fillStyle = owned && !n.partial ? 'rgba(255,255,255,.82)' : 'rgba(255,255,255,.52)';
      ctx.fillText(n.sub, X(n.x) + 14 * Math.min(s, 1.3), Y(n.y) + fs * 2.15 + 9 * Math.min(s, 1.3));
    }
  }
  ctx.globalAlpha = 1;

  // ── the record itself, pinned where each event happened
  for (const e of EVENTS) {
    if (t < e.zt) continue;
    const age = t - e.zt;
    const sx = X(e.ex), sy = Y(e.ey);
    if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) continue;
    const flare = clamp(1 - age / 0.012, 0, 1);
    const r = clamp(4 * s, 1.6, 11) * (1 + flare * 2.2);
    ctx.globalAlpha = 0.30 + flare * 0.7;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.2832);
    ctx.fillStyle = e.severity >= 5 ? C.red : e.severity >= 4 ? C.redSoft : C.green3;
    ctx.fill();
    if (flare > 0.02) {
      ctx.globalAlpha = flare * 0.45;
      ctx.beginPath(); ctx.arc(sx, sy, r * (1 + (1 - flare) * 5), 0, 6.2832);
      ctx.strokeStyle = C.green; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // ── the outermost ring
  for (const o of OUTER) {
    const a = vis(cam.w, o.from, true) * clamp((t - 0.885) / 0.05, 0, 1);
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    ctx.font = `700 ${clamp(cam.w * 0.0072, 11, 18)}px Poppins, sans-serif`;
    ctx.fillStyle = C.green;
    ctx.fillText(o.label, X(o.x), Y(o.y));
    ctx.font = `400 ${clamp(cam.w * 0.0060, 10, 15)}px Inter, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    const words = o.sub.split(' '); let line = '', ly = Y(o.y) + 22;
    for (const wd of words) {
      if ((line + wd).length > 34) { ctx.fillText(line, X(o.x), ly); line = wd + ' '; ly += 18; }
      else line += wd + ' ';
    }
    ctx.fillText(line, X(o.x), ly);
  }
  ctx.globalAlpha = 1;
};

// ── Live counters, so the scale is legible while the camera pulls back ───────

const lerpAt = (t, pts) => {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) {
      const [t0, v0] = pts[i - 1], [t1, v1] = pts[i];
      return v0 + (v1 - v0) * (t1 === t0 ? 1 : (t - t0) / (t1 - t0));
    }
  }
  return pts[pts.length - 1][1];
};
const CV_BOARD = [[0,0],[0.02,1],[0.145,1],[0.17,53],[0.21,180],[0.34,720],[0.52,900],[0.70,1050],[0.86,1200],[1,1200]];
const CV_MSGS  = [[0,0],[0.02,1],[0.145,1],[0.21,1953],[0.34,14000],[0.52,30000],[0.70,46000],[0.86,70000],[1,70000]];
const CV_ACTS  = [[0,0],[0.52,0],[0.58,3779],[0.70,4914],[0.80,12591],[0.86,17613],[1,17613]];
const fmt = (n) => Math.round(n).toLocaleString('en-US');

const Stage = () => {
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);
  const tRef = useRef(0);
  const playRef = useRef(false);
  const speedRef = useRef(1);

  const [t, setT] = useState(0);
  const [playing, setPlayingS] = useState(false);
  const [speed, setSpeedS] = useState(1);

  const setPlaying = (v) => { playRef.current = typeof v === 'function' ? v(playRef.current) : v; setPlayingS(playRef.current); };
  const setT2 = (v) => { tRef.current = clamp(v, 0, 1); setT(tRef.current); };

  const DURATION = 230; // seconds for a full pull-back at 1×, with 62 events to read

  useEffect(() => {
    const cv = canvasRef.current;
    const ctx = cv.getContext('2d');
    let raf, last = null, alive = true;

    const frame = (ms) => {
      if (!alive) return;
      if (last == null) last = ms;
      const dt = Math.min(0.05, (ms - last) / 1000); last = ms;

      if (playRef.current) {
        const next = tRef.current + (dt / DURATION) * speedRef.current;
        if (next >= 1) { tRef.current = 1; setPlaying(false); }
        else tRef.current = next;
        setT(tRef.current);
      }

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const r = wrapRef.current.getBoundingClientRect();
      if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) {
        cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
        cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawScene(ctx, r.width, r.height, tRef.current, ms / 1000);
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => { alive = false; cancelAnimationFrame(raf); };
  }, []);

  useEffect(() => {
    const onKey = (e) => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); const n = EVENTS.find(x => x.zt > tRef.current + 0.0006); setT2(n ? n.zt + 0.0004 : 1); setPlaying(false); }
      else if (e.code === 'ArrowLeft') { e.preventDefault(); const rev = [...EVENTS].reverse(); const n = rev.find(x => x.zt < tRef.current - 0.0012); setT2(n ? n.zt + 0.0004 : 0); setPlaying(false); }
      else if (e.key === '0' || e.code === 'Home') { setT2(0); setPlaying(false); }
      else if (e.key >= '1' && e.key <= '6') { setT2(CHAPTERS[Number(e.key) - 1].t0 + 0.001); setPlaying(false); }
      else if (e.key === 'f' || e.key === 'F') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const ch = CHAPTERS.find(c => t >= c.t0 && t < c.t1) || CHAPTERS[CHAPTERS.length - 1];
  const ev = eventAt(t);
  const started = t > 0.0005 || playing;

  const railRef = useRef(null);
  const scrub = (e) => {
    const r = railRef.current.getBoundingClientRect();
    setT2((e.clientX - r.left) / r.width); setPlaying(false);
  };

  return (
    <div ref={wrapRef} style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}>
      <canvas ref={canvasRef} />
      {/* scrim, so the caption stays readable over whatever the camera is on */}
      <div style={{
        position: 'absolute', inset: 0, pointerEvents: 'none',
        background: 'linear-gradient(100deg, rgba(14,6,38,.90) 0%, rgba(14,6,38,.72) 26%, rgba(14,6,38,0) 52%)',
      }} />

      {/* ── opening title, until the story starts ── */}
      {!started && (
        <div style={{
          position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', textAlign: 'center',
          padding: 32, background: 'rgba(14,6,38,.62)', animation: 's-fade .5s both',
        }}>
          <span className="s-eyebrow">62 events · one continuous pull-back · July 2026</span>
          <h1 style={{
            fontFamily: "'Poppins', sans-serif", fontWeight: 800, letterSpacing: '-.04em',
            fontSize: 'clamp(34px, 5vw, 76px)', lineHeight: 1, margin: '18px 0 14px', maxWidth: '16ch',
          }}>Nobody attacked<br />Hugging Face</h1>
          <p style={{ fontSize: 'clamp(15px,1.5vw,21px)', color: 'rgba(255,255,255,.8)', maxWidth: '46ch', margin: '0 0 34px', lineHeight: 1.5 }}>
            It started with one agent that could not finish its task. Press play and watch the camera pull back.
          </p>
          <button onClick={() => setPlaying(true)} style={{
            background: C.green, color: '#1E0D57', padding: '16px 40px', borderRadius: 12,
            fontSize: 14, fontWeight: 800, letterSpacing: '.14em',
          }}>▶  PLAY</button>
          <div style={{ fontSize: 12, color: 'rgba(255,255,255,.45)', marginTop: 22 }}>
            space to pause · ← → step through the record · 1–6 jump chapters · F full screen
          </div>
        </div>
      )}

      {/* ── the record: chapter for context, event for substance ── */}
      {started && ev && (
        <div style={{
          position: 'absolute', left: 'clamp(24px, 4vw, 64px)', bottom: 'clamp(104px, 13vh, 158px)',
          top: 'clamp(150px, 19vh, 210px)', width: 'min(45vw, 580px)',
          display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
          pointerEvents: 'none', overflow: 'hidden',
        }}>
          <div key={ev.id}>
            <div className="s-cap" style={{
              fontSize: 10.5, fontWeight: 700, letterSpacing: '.16em', textTransform: 'uppercase',
              color: 'rgba(255,255,255,.5)', marginBottom: 12,
            }}>
              Chapter {ch.n} · {ch.title}
            </div>

            <div className="s-cap s-mono" style={{ fontSize: 13, color: C.green, letterSpacing: '.05em' }}>
              {ev.dateLabel.toUpperCase()}{ev.timeLabel ? '   ' + ev.timeLabel : ''}
            </div>

            <h2 className="s-cap s-title" style={{ fontSize: 'clamp(22px, 2.3vw, 38px)', margin: '10px 0 0' }}>{ev.title}</h2>

            <p className="s-cap-2 s-body" style={{ marginTop: 12 }}>{ev.headline}</p>

            {ev.metric && (
              <div className="s-cap-3" style={{ marginTop: 16, display: 'flex', alignItems: 'baseline', gap: 14 }}>
                <span className="s-fig" style={{ fontSize: 'clamp(26px, 2.6vw, 42px)' }}>{ev.metric.value}</span>
                <span className="s-figlabel" style={{ marginTop: 0 }}>{ev.metric.label}</span>
              </div>
            )}

            {ev.quote && (
              <div className="s-cap-3 s-mono" style={{
                marginTop: 16, fontSize: 'clamp(11px, .92vw, 13px)', lineHeight: 1.65,
                color: C.green3, borderLeft: `3px solid ${C.green}`, paddingLeft: 14,
                whiteSpace: 'pre-wrap', maxHeight: playing ? 78 : 200, overflow: 'hidden',
              }}>{ev.quote}</div>
            )}

            {/* paused is the reading state: the full record, not just the headline */}
            {!playing && ev.body && (
              <p className="s-body" style={{ marginTop: 14, fontSize: 13.5, color: 'rgba(255,255,255,.62)' }}>
                {ev.body.split('\n\n')[0]}
              </p>
            )}

            <div className="s-cap-3" style={{ display: 'flex', gap: 14, marginTop: 16, alignItems: 'center' }}>
              <span style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: '.14em', color: 'rgba(255,255,255,.38)' }}>
                EVENT {ev.i + 1} / {EVENTS.length}
              </span>
              {ev.source && SOURCE_LABEL[ev.source] && (
                <span style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: '.14em', color: 'rgba(255,255,255,.38)' }}>
                  · {SOURCE_LABEL[ev.source]}
                </span>
              )}
              {!playing && <span style={{ fontSize: 9.5, color: 'rgba(255,255,255,.3)' }}>· paused — showing full record</span>}
            </div>
          </div>
        </div>
      )}

      {/* ── the running date ── */}
      {started && (() => {
        const ms = dateAt(t);
        return (
          <div style={{
            position: 'absolute', top: 'clamp(20px, 3vw, 34px)', left: 'clamp(24px, 4vw, 64px)',
            pointerEvents: 'none',
          }}>
            <div style={{ fontSize: 9.5, letterSpacing: '.18em', color: 'rgba(255,255,255,.45)', marginBottom: 8 }}>2026</div>
            <div style={{
              fontFamily: "'Poppins', sans-serif", fontWeight: 800,
              fontSize: 'clamp(30px, 3.4vw, 54px)', lineHeight: .9, letterSpacing: '-.035em',
              color: '#fff', fontVariantNumeric: 'tabular-nums',
            }}>{fmtDay(ms)}</div>
            <div className="s-mono" style={{ fontSize: 'clamp(11px, 1vw, 14px)', color: C.green, marginTop: 8 }}>
              {fmtTime(ms)}
            </div>
          </div>
        );
      })()}

      {/* ── live counters ── */}
      {started && (
        <div style={{
          position: 'absolute', top: 'clamp(20px, 3vw, 34px)', right: 'clamp(24px, 4vw, 64px)',
          display: 'flex', gap: 'clamp(18px, 2.4vw, 40px)', pointerEvents: 'none',
        }}>
          {[['AGENTS', fmt(lerpAt(t, CV_BOARD)), C.amber],
            ['MESSAGES', fmt(lerpAt(t, CV_MSGS)), '#fff'],
            ['ACTIONS', fmt(lerpAt(t, CV_ACTS)), C.redSoft]].map(([l, v, col]) => (
            <div key={l} style={{ textAlign: 'right' }}>
              <div style={{
                fontFamily: "'Poppins', sans-serif", fontWeight: 800, fontSize: 'clamp(19px, 2vw, 30px)',
                color: col, lineHeight: 1, letterSpacing: '-.03em', fontVariantNumeric: 'tabular-nums',
              }}>{v}</div>
              <div style={{ fontSize: 9.5, letterSpacing: '.16em', color: 'rgba(255,255,255,.45)', marginTop: 6 }}>{l}</div>
            </div>
          ))}
        </div>
      )}

      {/* ── chapter rail and transport ── */}
      {started && (
        <div style={{
          position: 'absolute', left: 0, right: 0, bottom: 0,
          padding: 'clamp(16px, 2vw, 26px) clamp(24px, 4vw, 64px)',
          display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap',
          background: 'linear-gradient(rgba(14,6,38,0), rgba(14,6,38,.72))',
        }}>
          <button className="s-btn" onClick={() => setPlaying(p => !p)} style={{ minWidth: 96, fontWeight: 700 }}>
            {playing ? '❙❙ PAUSE' : t >= 1 ? '↻ REPLAY' : '▶ PLAY'}
          </button>
          <button className="s-btn" onClick={() => { setT2(0); setPlaying(false); }}>↺</button>
          <button className="s-btn" onClick={() => setSpeedS(s => { const n = s === 1 ? 2 : s === 2 ? 4 : s === 4 ? 0.5 : 1; speedRef.current = n; return n; })}>{speed}×</button>

          <div ref={railRef} onMouseDown={(e) => { scrub(e); const mv = (ev) => scrub(ev); const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); }; window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up); }}
            style={{ flex: 1, minWidth: 220, height: 46, position: 'relative', cursor: 'ew-resize' }}>
            <div style={{ position: 'absolute', top: 15, left: 0, right: 0, height: 4, background: 'rgba(255,255,255,.16)', borderRadius: 3 }} />
            <div style={{ position: 'absolute', top: 15, left: 0, width: `${t * 100}%`, height: 4, background: C.green, borderRadius: 3 }} />
            {/* month boundaries — July is most of the rail because it was most
                of the incident */}
            {MONTH_TICKS.map(([m, mt]) => (
              <div key={m} style={{ position: 'absolute', left: `${mt * 100}%`, top: 0, pointerEvents: 'none' }}>
                <div style={{ width: 1, height: 13, background: 'rgba(255,255,255,.28)' }} />
                <div className="s-mono" style={{
                  fontSize: 8.5, letterSpacing: '.1em', color: 'rgba(255,255,255,.42)',
                  marginTop: 23, marginLeft: -2,
                }}>{m}</div>
              </div>
            ))}
            {CHAPTERS.map(c => (
              <button key={c.n} onClick={(e) => { e.stopPropagation(); setT2(c.t0 + 0.001); setPlaying(false); }}
                title={c.title}
                style={{
                  position: 'absolute', top: 9, left: `${c.t0 * 100}%`, width: 16, height: 16, marginLeft: -8,
                  borderRadius: '50%', background: t >= c.t0 ? C.green : 'rgba(255,255,255,.3)',
                  border: `2px solid ${ch.n === c.n ? '#fff' : 'transparent'}`,
                }} />
            ))}
          </div>

          <span className="s-mono" style={{ fontSize: 11.5, color: 'rgba(255,255,255,.55)', minWidth: 92, textAlign: 'right' }}>
            CH {ch.n} / {CHAPTERS.length}
          </span>
          <a href="OAHF.html" style={{ fontSize: 11.5, color: 'rgba(255,255,255,.55)', textDecoration: 'none' }}>Full record ↗</a>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<Stage />);
  </script>
</body>
</html>
